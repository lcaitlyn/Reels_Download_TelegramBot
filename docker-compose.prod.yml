x-common-env: &common-env
  BOT_TOKEN: ${BOT_TOKEN}
  TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
  BOT_USERNAME: ${BOT_USERNAME}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  INSTAGRAM_COOKIES_FILE: /app/cookies/cookies.txt

services:
  # Redis для кэширования и очередей (внутри compose‑сети, без проброса порта наружу)
  redis:
    image: redis:7-alpine
    container_name: downloader_bot_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Основной Telegram‑бот (образ один, общий с воркерами)
  bot:
    build: .
    image: downloader_bot_app
    container_name: downloader_bot
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies:ro
    restart: unless-stopped
    command: ["python", "main.py"]

  # Worker для скачивания видео (1)
  worker1:
    image: downloader_bot_app
    container_name: downloader_bot_worker1
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies:ro
    restart: unless-stopped
    command: ["python", "-m", "src.workers.download_worker"]

  # Worker для скачивания видео (2)
  worker2:
    image: downloader_bot_app
    container_name: downloader_bot_worker2
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies:ro
    restart: unless-stopped
    command: ["python", "-m", "src.workers.download_worker"]

volumes:
  redis_data:

