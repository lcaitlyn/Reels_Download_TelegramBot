services:
  # Общие переменные окружения для bot/worker1/worker2
  x-common-env: &common-env
    BOT_TOKEN: ${BOT_TOKEN}
    TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
    BOT_USERNAME: ${BOT_USERNAME}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:-analytics}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    INSTAGRAM_COOKIES_FILE: /app/cookies/cookies.txt
  # Redis для кэширования и очередей (внутри compose‑сети, без проброса порта наружу)
  redis:
    image: redis:7-alpine
    container_name: downloader_bot_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Основной Telegram‑бот (здесь один раз собирается образ, его используют и workers)
  bot:
    build: .
    image: downloader_bot_app
    container_name: downloader_bot
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies:ro
    restart: unless-stopped
    command: ["python", "main.py"]

  # Worker для скачивания видео (1)
  worker1:
    image: downloader_bot_app
    container_name: downloader_bot_worker1
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies:ro
    restart: unless-stopped
    command: ["python", "-m", "src.workers.download_worker"]

  # Worker для скачивания видео (2) — можно удалить или скейлить через --scale
  worker2:
    image: downloader_bot_app
    container_name: downloader_bot_worker2
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies:ro
    restart: unless-stopped
    command: ["python", "-m", "src.workers.download_worker"]

volumes:
  redis_data:

